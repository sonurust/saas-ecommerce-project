<div class="container mx-auto p-4">
    <h2 class="text-2xl font-bold mb-4">Add Product</h2>
    @if (productCreated) {
        <div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4">
            Product created successfully!
        </div>
    }
    <form [formGroup]="addProductForm" (ngSubmit)="onSubmit()" class="max-w-md">
        <div class="mb-4">
            <label for="skuCode" class="block text-gray-700 font-bold mb-2">SKU Code</label>
            <input id="skuCode" formControlName="skuCode" type="text" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
           
        </div>
        <div class="mb-4">
            <label for="name" class="block text-gray-700 font-bold mb-2">Name</label>
            <input id="name" formControlName="name" type="text" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
           
        </div>
        <div class="mb-4">
            <label for="description" class="block text-gray-700 font-bold mb-2">Description</label>
            <textarea id="description" formControlName="description" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"></textarea>
            
        </div>
        <div class="mb-4">
            <label for="price" class="block text-gray-700 font-bold mb-2">Price</label>
            <input id="price" formControlName="price" type="number" step="0.01" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
            
        </div>
        <button type="submit" [disabled]="addProductForm.invalid" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">
            Add Product
        </button>

    </form>

</div>
